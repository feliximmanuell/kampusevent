name: kampusevent

# ============================================================
#  KampusEvent - orkestrasi 3 container wajib:
#    frontend (React + Nginx)  ->  backend (Express)  ->  db (PostgreSQL)
#  Ditambah 2 container opsional untuk akses publik (profile).
#
#  Lokal  : docker compose up -d --build
#  Server : docker compose pull && docker compose up -d
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: kampusevent-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    image: ghcr.io/${GHCR_OWNER:-local}/kampusevent-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: kampusevent-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - edge
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    image: ghcr.io/${GHCR_OWNER:-local}/kampusevent-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: kampusevent-frontend
    ports:
      - '${APP_PORT:-80}:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ----------------------------------------------------------
  #  Akses publik tanpa membuka port router (opsional).
  #  Aktifkan dengan COMPOSE_PROFILES=tunnel (ngrok, URL acak)
  #  atau tunnel-static (ngrok + domain statis gratis).
  # ----------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: kampusevent-tunnel
    profiles: ['tunnel']
    command: http frontend:8080 --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  ngrok-static:
    image: ngrok/ngrok:latest
    container_name: kampusevent-tunnel
    profiles: ['tunnel-static']
    command: http frontend:8080 --url=${NGROK_URL} --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  # Alternatif tanpa akun: URL acak *.trycloudflare.com
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kampusevent-tunnel
    profiles: ['tunnel-cf']
    command: tunnel --no-autoupdate --url http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

networks:
  edge:
    driver: bridge
  # Jaringan database dibuat internal: container db tidak punya akses internet
  # dan tidak bisa diakses dari luar jaringan ini.
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
    name: kampusevent-pgdata
